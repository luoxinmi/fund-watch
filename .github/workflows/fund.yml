name: fund-watch
on:
  schedule:
    # 最小 cron 间隔 5 分钟（GitHub 硬限制）；2-57/5 避开整点拥堵段
    - cron: "2-57/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fund-commit
  cancel-in-progress: false
jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: sample
        run: python3 scripts/fund_watch.py --symbols EVAA,ETH,PEPE,BONK --out data/fund
      - name: commit
        run: |
          git config user.name "fund-watch"
          git config user.email "fund-watch@users.noreply.github.com"
          git add data/fund
          git commit -m "fund $(date -u +%Y-%m-%dT%H:%MZ)" || echo "no changes"
          for i in 1 2 3; do git push && break || sleep 3; done
